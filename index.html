<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bumper Orbit - Mini Game</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #111827, #030712);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #f9fafb;
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      align-items: center;
      background: rgba(17, 24, 39, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 24px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 10;
      pointer-events: none;
    }
    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9ca3af;
    }
    .hud-val {
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
    }
    #gameover-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 30px 45px;
      border-radius: 20px;
      backdrop-filter: blur(20px);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      z-index: 20;
    }
    #gameover-modal h2 {
      margin: 0 0 10px 0;
      font-size: 32px;
      color: #f43f5e;
    }
    #gameover-modal p {
      margin: 8px 0 20px 0;
      font-size: 18px;
      color: #e5e7eb;
    }
    #restart-btn {
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      border: none;
      color: white;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
      transition: all 0.2s;
    }
    #restart-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6);
    }
    canvas {
      display: block;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="hud-item">
      <span class="hud-label">Score</span>
      <span class="hud-val" id="score-val">0</span>
    </div>
    <div style="width: 1px; height: 28px; background: rgba(255,255,255,0.15);"></div>
    <div class="hud-item">
      <span class="hud-label">Tempo</span>
      <span class="hud-val" id="timer-val" style="color: #f59e0b;">30s</span>
    </div>
    <div style="width: 1px; height: 28px; background: rgba(255,255,255,0.15);"></div>
    <div class="hud-item">
      <span class="hud-label">Obiettivo</span>
      <span style="font-size: 13px; color: #a7f3d0; font-weight: 600;">Spingi le palline nel Buco Nero!</span>
    </div>
  </div>

  <div id="gameover-modal">
    <h2>Tempo Scaduto!</h2>
    <p>Hai risucchiato <span id="final-score" style="color: #38bdf8; font-weight: bold;">0</span> palline!</p>
    <button id="restart-btn" onclick="resetGame()">Gioca Ancora</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      blackHole.x = width / 2;
      blackHole.y = height / 2;
    });

    const colors = ['#f43f5e', '#ec4899', '#d946ef', '#a855f7', '#6366f1', '#0ea5e9', '#10b981', '#f59e0b'];

    let score = 0;
    let timeLeft = 30;
    let gameOver = false;
    let timerInterval = null;

    const blackHole = {
      x: width / 2,
      y: height / 2,
      r: 45,
      angle: 0
    };

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.alpha = 1;
        this.r = 3 + Math.random() * 3;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.03;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    let particles = [];

    class Ball {
      constructor(x, y, r, color) {
        this.x = x;
        this.y = y;
        this.r = r;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.mass = r;
        this.isGrabbed = false;
        this.scale = 1;
      }

      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(1, this.r * this.scale), 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = this.isGrabbed ? 25 : 12;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x - (this.r * 0.3) * this.scale, this.y - (this.r * 0.3) * this.scale, (this.r * 0.25) * this.scale, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.fill();
        ctx.restore();
      }

      update() {
        if (!this.isGrabbed) {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.985;
          this.vy *= 0.985;

          // Rimbalzo sui bordi
          if (this.x - this.r < 0) { this.x = this.r; this.vx = -this.vx * 0.8; }
          else if (this.x + this.r > width) { this.x = width - this.r; this.vx = -this.vx * 0.8; }
          if (this.y - this.r < 0) { this.y = this.r; this.vy = -this.vy * 0.8; }
          else if (this.y + this.r > height) { this.y = height - this.r; this.vy = -this.vy * 0.8; }
        }
      }
    }

    let balls = [];

    function spawnBall() {
      const r = 22 + Math.random() * 14;
      let x, y;
      // Spawna lontano dal buco nero
      do {
        x = r + Math.random() * (width - r * 2);
        y = r + Math.random() * (height - r * 2);
      } while (Math.hypot(x - blackHole.x, y - blackHole.y) < blackHole.r + 120);

      const color = colors[Math.floor(Math.random() * colors.length)];
      balls.push(new Ball(x, y, r, color));
    }

    function initGame() {
      balls = [];
      particles = [];
      score = 0;
      timeLeft = 30;
      gameOver = false;
      document.getElementById('score-val').innerText = score;
      document.getElementById('timer-val').innerText = timeLeft + 's';
      document.getElementById('gameover-modal').style.display = 'none';

      for (let i = 0; i < 20; i++) {
        spawnBall();
      }

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          document.getElementById('timer-val').innerText = timeLeft + 's';
        } else {
          clearInterval(timerInterval);
          gameOver = true;
          document.getElementById('final-score').innerText = score;
          document.getElementById('gameover-modal').style.display = 'block';
          if (grabbedBall) {
            grabbedBall.isGrabbed = false;
            grabbedBall = null;
          }
        }
      }, 1000);
    }

    let mouseX = width / 2;
    let mouseY = height / 2;
    let prevMouseX = mouseX;
    let prevMouseY = mouseY;
    let grabbedBall = null;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    window.addEventListener('mousedown', (e) => {
      if (gameOver) return;

      if (grabbedBall) {
        grabbedBall.isGrabbed = false;
        grabbedBall.vx = (mouseX - prevMouseX) * 0.8;
        grabbedBall.vy = (mouseY - prevMouseY) * 0.8;
        grabbedBall = null;
        return;
      }

      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        if (Math.hypot(e.clientX - b.x, e.clientY - b.y) <= b.r) {
          grabbedBall = b;
          b.isGrabbed = true;
          balls.splice(i, 1);
          balls.push(b);
          break;
        }
      }
    });

    function resolveCollisions() {
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          const b1 = balls[i];
          const b2 = balls[j];

          const dx = b2.x - b1.x;
          const dy = b2.y - b1.y;
          const dist = Math.hypot(dx, dy);

          if (dist < b1.r + b2.r && dist > 0) {
            const overlap = (b1.r + b2.r) - dist;
            const nx = dx / dist;
            const ny = dy / dist;

            if (b1.isGrabbed) {
              b2.x += nx * overlap;
              b2.y += ny * overlap;
            } else if (b2.isGrabbed) {
              b1.x -= nx * overlap;
              b1.y -= ny * overlap;
            } else {
              b1.x -= nx * overlap * 0.5;
              b1.y -= ny * overlap * 0.5;
              b2.x += nx * overlap * 0.5;
              b2.y += ny * overlap * 0.5;
            }

            const kx = b1.vx - b2.vx;
            const ky = b1.vy - b2.vy;
            const p = 2 * (nx * kx + ny * ky) / (b1.mass + b2.mass);

            if (!b1.isGrabbed) {
              b1.vx -= p * b2.mass * nx * 1.1;
              b1.vy -= p * b2.mass * ny * 1.1;
            }
            if (!b2.isGrabbed) {
              b2.vx += p * b1.mass * nx * 1.1;
              b2.vy += p * b1.mass * ny * 1.1;
            }
          }
        }
      }
    }

    function checkBlackHole() {
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];

        // La pallina agganciata è immune al buco nero: non può essere risucchiata né fare punti direttamente!
        if (b.isGrabbed) continue;

        const dist = Math.hypot(b.x - blackHole.x, b.y - blackHole.y);

        // Gravità vicina per le palline libere
        if (dist < blackHole.r + 70) {
          const pull = (1 - dist / (blackHole.r + 70)) * 0.8;
          b.vx += (blackHole.x - b.x) * 0.05 * pull;
          b.vy += (blackHole.y - b.y) * 0.05 * pull;
        }

        // Risucchio nel buco nero
        if (dist < blackHole.r) {
          // Crea esplosione particelle
          for (let p = 0; p < 12; p++) {
            particles.push(new Particle(b.x, b.y, b.color));
          }

          balls.splice(i, 1);
          score += 100;
          document.getElementById('score-val').innerText = score;
          spawnBall(); // Nuova pallina
        }
      }
    }

    function drawBlackHole() {
      blackHole.angle += 0.03;

      ctx.save();
      ctx.translate(blackHole.x, blackHole.y);

      // Vortice esterno luminoso
      const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, blackHole.r + 30);
      grad.addColorStop(0, '#000000');
      grad.addColorStop(0.5, '#6366f1');
      grad.addColorStop(0.8, '#ec4899');
      grad.addColorStop(1, 'transparent');

      ctx.beginPath();
      ctx.arc(0, 0, blackHole.r + 30, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Disco centrale oscuro
      ctx.beginPath();
      ctx.arc(0, 0, blackHole.r, 0, Math.PI * 2);
      ctx.fillStyle = '#030712';
      ctx.shadowColor = '#818cf8';
      ctx.shadowBlur = 20;
      ctx.fill();

      // Anelli orbitali
      ctx.rotate(blackHole.angle);
      ctx.strokeStyle = 'rgba(236, 72, 153, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, blackHole.r + 15, blackHole.r + 5, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      drawBlackHole();

      if (grabbedBall) {
        grabbedBall.vx = (mouseX - grabbedBall.x) * 0.45;
        grabbedBall.vy = (mouseY - grabbedBall.y) * 0.45;
        grabbedBall.x += grabbedBall.vx;
        grabbedBall.y += grabbedBall.vy;
      }

      resolveCollisions();
      checkBlackHole();

      balls.forEach((ball) => {
        ball.update();
        ball.draw();
      });

      // Particelle
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      prevMouseX = mouseX;
      prevMouseY = mouseY;

      requestAnimationFrame(animate);
    }

    window.resetGame = initGame;
    initGame();
    animate();
  </script>
</body>
</html>
